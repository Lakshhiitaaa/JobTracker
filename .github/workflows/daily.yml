name: Daily Job Tracker
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python main.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      # jobs.db must be committed back - the runner filesystem is wiped each run
      - run: |
          git config user.name "job-tracker"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.db reports/
          git diff --staged --quiet || git commit -m "daily run $(date +%F)"
          git push
